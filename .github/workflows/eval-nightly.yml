name: Nightly eval (Mock)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-md
          path: docs/EVAL.md
