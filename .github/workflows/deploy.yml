name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, prod]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      - name: Login to Amazon ECR
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push images
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: |
          echo "Build/push container images tagged with $GITHUB_SHA"
          # docker buildx build --push -t $ECR_REGISTRY/trailforge-api:$GITHUB_SHA -f infra/docker/Dockerfile.api .
      - name: Terraform plan
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        working-directory: infra/terraform/envs/${{ github.event.inputs.environment || 'staging' }}
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -input=false -no-color
      - name: Deploy (placeholder)
        run: |
          echo "Deploy to ${{ github.event.inputs.environment || 'staging' }} via blue/green strategy"
          echo "Run smoke tests, verify SLOs, auto-rollback on failure"
